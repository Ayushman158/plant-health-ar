<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05080c">

  <title>Plant Vision AR</title>
  <meta name="description" content="Spatial Plant Health & Telemetry Bio-Diagnostic WebAR">

  <link rel="stylesheet" href="/src/index.css">
</head>
<body>

  <main id="app-viewport">
    <!-- Camera & Visual Layer -->
    <div id="media-layer">
      <video id="camera-video" playsinline muted autoplay></video>
      <canvas id="display-canvas"></canvas>
      <canvas id="spectral-canvas"></canvas>
      <div class="viewport-ambient-vignette"></div>
    </div>

    <!-- Spatial Bio-Scanning Reticle Frame -->
    <div id="spatial-scan-frame" class="idle">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-laser-line"></div>
      <div class="scan-crosshair"></div>
      <div class="scan-badge">LEAF FOCUSED</div>
    </div>

    <!-- Interactive Spatial Leaf Pins Layer -->
    <div id="spatial-pins-layer"></div>

    <!-- VisionOS Spatial Chrome UI -->
    <div id="spatial-ui-root">
      <!-- Top Bar: Single sleek scanning status capsule -->
      <header class="spatial-top-bar">
        <div id="spatial-status-pill" class="status-capsule idle">
          <span class="status-pulse-dot"></span>
          <span class="status-text-content">Point camera at your plant's leaves</span>
        </div>
      </header>

      <!-- Center / Bottom: Floating Diagnostic Telemetry Unit -->
      <div id="spatial-card-cluster" class="cluster-hidden">
        <!-- VisionOS Segmented Mode Switcher (VIGOR | SPECTRAL | TISSUE) -->
        <div id="mode-segmented-control"></div>

        <!-- VisionOS Floating 3D Telemetry Card Anchor -->
        <div id="spatial-card-anchor"></div>
      </div>

      <!-- Bottom Bar: Minimal Collapsible Specimen Drawer -->
      <footer class="spatial-bottom-bar">
        <div class="specimens-trigger-wrapper">
          <button id="specimens-toggle-btn" type="button" class="specimens-toggle-pill" aria-label="Toggle botanical specimens">
            <span class="specimen-icon">🌿</span>
            <span class="specimen-btn-label">Presets</span>
            <span class="specimen-arrow">▾</span>
          </button>
          <div id="specimen-deck-container" class="specimens-drawer collapsed"></div>
        </div>
      </footer>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
